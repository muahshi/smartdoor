[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
hilt = "2.52"
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigationCompose = "2.8.5"

# Phase A1.2 — Core Infrastructure additions.
# Nothing below this line is consumed by any screen yet; wiring happens in A1.3+.
supabase = "3.1.4"
ktorClientAndroid = "3.0.3"
kotlinxSerializationJson = "1.7.3"
kotlinxCoroutinesAndroid = "1.9.0"
datastorePreferences = "1.1.1"
securityCrypto = "1.1.0-alpha06"
kotlinSerializationPlugin = "2.0.21"

# Phase A1.5 — verify-pin integration additions.
hiltNavigationCompose = "1.2.0"

# Phase 12E.2 — PREMIUM APP IDENTITY. coreSplashscreen backs the official
# Android 12+ SplashScreen API (system splash shown before the Premium
# Compose splash). zxing is a small, well-established QR *encoder* only
# (no camera/scanning module pulled in) — used to render the Smart Plate's
# QR code as a real scannable bitmap instead of the placeholder icon
# QrPreviewScreen already documents using ("no QR-bitmap rendering library
# exists anywhere in this Gradle project today").
coreSplashscreen = "1.0.1"
zxingCore = "3.5.3"

# Phase 12E.10 — NATIVE QR SCANNER. CameraX for the live preview + frame
# analysis pipeline. Decoding itself does NOT add ML Kit — it reuses the
# zxing-core dependency already declared above (MultiFormatReader against
# each analyzed frame), so this phase only adds the camera plumbing.
cameraX = "1.4.1"

# Phase 12E.15 — MASKED CALL → NATIVE ANDROID FCM NOTIFICATION. Firebase
# BOM pins firebase-messaging's transitive versions; the Google Services
# Gradle plugin reads app/google-services.json (NOT present in this repo —
# see android/app/build.gradle.kts's conditional apply) to inject the
# Firebase project identity at build time. kotlinxCoroutinesPlayServices
# is only for the `Task<T>.await()` extension used once, in
# core/notification/PushTokenSync.kt, to bridge
# FirebaseMessaging.getInstance().token (a Play Services Task, not a
# suspend fun) into a coroutine.
firebaseBom = "33.7.0"
googleServices = "4.4.2"
kotlinxCoroutinesPlayServices = "1.9.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Phase A1.3 — Navigation Compose. Only the NavHost/graph is used in this
# phase; no screen has a ViewModel wired to it yet, so hilt-navigation-compose
# is intentionally not added until a later phase needs hiltViewModel().
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Phase A1.5 — LoginScreen now has a ViewModel, so hiltViewModel() is needed
# inside the nav graph's composable() blocks.
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# Supabase Kotlin SDK — modules included now so the client compiles; only
# Auth/Postgrest/Realtime plugins are attached to the client instance, none
# of them are called anywhere in A1.2.
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-realtime = { group = "io.github.jan-tennert.supabase", name = "realtime-kt" }
# Phase A1.5 — needed to invoke the existing verify-pin Edge Function
# (io.github.jan.supabase.functions.Functions plugin / client.functions.invoke).
supabase-functions = { group = "io.github.jan-tennert.supabase", name = "functions-kt" }
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktorClientAndroid" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Phase 12E.2 — PREMIUM APP IDENTITY.
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxingCore" }

# Phase 12E.10 — NATIVE QR SCANNER.
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "cameraX" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraX" }

# Phase 12E.15 — MASKED CALL → NATIVE ANDROID FCM NOTIFICATION.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging-ktx" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutinesPlayServices" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinSerializationPlugin" }
# Phase 12E.15 — applied conditionally in android/app/build.gradle.kts
# (only if google-services.json is present) so the build does not hard-fail
# for anyone building this repo before that file is supplied.
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
