<?xml version="1.0" encoding="UTF-8"?>
<!--
  MySmartDoor Official QR Center Badge
  Master vector asset. Traced from the official Brand Asset Guide.
  This is the ONLY badge that belongs in the center of a generated QR code.

  2026-07-26: viewBox cropped from "0 0 256 256" to the shield's actual
  content bounding box (+1.5% safety padding). See premiumQr.ts and
  services/qr.js for the renderer-side fix. viewBox left UNCHANGED here so
  BADGE_ASPECT_HW (854/697) in the renderers stays valid.

  2026-07-26 (later same day): artwork-only refresh, per explicit request.
  Outer/inner shield outline path data (the two large paths) is byte-for-
  byte IDENTICAL to the previous version — proportions are untouched.
  Changes are additive only:
    • Richer 5-stop metallic gold gradient (was a flat #D4AF37 fill),
      shares the same F4D976 → D4AF37 → 9C7A1E family used by the QR
      module gradient in qr.js/premiumQr.ts for brand consistency.
    • Thicker visible border: the black inner-field path is shrunk ~7%
      toward the shield's center via an SVG transform (scale about
      centroid) — the outline path itself is not touched.
    • Soft diagonal gloss highlight, clipped to the shield silhouette.
    • N mark: same two path outlines as before, given the richer
      gradient + a subtle offset shadow duplicate for visual weight —
      no path-point edits.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="40.78 20.98 174.44 213.84">
  <title>MySmartDoor QR Center Badge</title>
  <desc>Official gold shield badge with the MySmartDoor "N" mark, on transparent background, for embedding in the center of QR codes</desc>

  <defs>
    <linearGradient id="shieldGold" gradientUnits="userSpaceOnUse" x1="55" y1="30" x2="205" y2="225">
      <stop offset="0%"   stop-color="#FDF0B8"/>
      <stop offset="18%"  stop-color="#F4D976"/>
      <stop offset="45%"  stop-color="#D4AF37"/>
      <stop offset="72%"  stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8A6510"/>
    </linearGradient>

    <linearGradient id="nGold" gradientUnits="userSpaceOnUse" x1="90" y1="65" x2="170" y2="185">
      <stop offset="0%"   stop-color="#FFF6DC"/>
      <stop offset="22%"  stop-color="#F4D976"/>
      <stop offset="55%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9C7A1E"/>
    </linearGradient>

    <linearGradient id="glossStreak" gradientUnits="userSpaceOnUse" x1="60" y1="20" x2="150" y2="130">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="35%"  stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- clip everything to the shield silhouette -->
    <clipPath id="shieldClip">
      <path d="M 127.80 24.09 L 113.10 36.75 L 99.22 44.50 L 57.37 54.51 L 54.92 68.59 L 43.89 77.37 L 43.89 151.89 L 50.22 173.32 L 64.92 192.31 L 80.64 204.35 L 128.20 231.71 L 181.89 200.06 L 196.19 187.20 L 205.37 174.14 L 212.11 151.27 L 212.11 77.37 L 202.11 69.41 L 197.82 53.28 L 174.95 50.02 L 157.19 44.50 L 144.33 37.56 Z"/>
    </clipPath>
  </defs>

  <!-- Outer shield outline — path data unchanged from production; richer gradient fill + a hairline edge stroke for crisp definition at small sizes -->
  <path fill="url(#shieldGold)" stroke="#6B4E0E" stroke-width="1.1"
        d="M 127.80 24.09 L 113.10 36.75 L 99.22 44.50 L 57.37 54.51 L 54.92 68.59 L 43.89 77.37 L 43.89 151.89 L 50.22 173.32 L 64.92 192.31 L 80.64 204.35 L 128.20 231.71 L 181.89 200.06 L 196.19 187.20 L 205.37 174.14 L 212.11 151.27 L 212.11 77.37 L 202.11 69.41 L 197.82 53.28 L 174.95 50.02 L 157.19 44.50 L 144.33 37.56 Z"/>

  <!-- Inner black field — same path as production, scaled ~7% toward centroid (127.9,127.9) so more gold border shows; only an affine transform, no point edits -->
  <path fill="#000000"
        transform="translate(127.9 127.9) scale(0.93) translate(-127.9 -127.9)"
        d="M 127.80 32.05 L 154.54 49.81 L 191.90 59.20 L 195.98 73.08 L 205.37 81.45 L 205.37 150.25 L 200.06 169.44 L 191.08 182.51 L 179.04 193.74 L 128.20 223.54 L 86.76 200.27 L 70.63 188.22 L 56.96 171.28 L 50.63 150.25 L 50.63 81.45 L 60.22 73.29 L 63.29 60.22 L 101.26 50.02 L 115.96 41.85 Z"/>

  <!-- N mark — shadow duplicate for depth (same path outlines, offset + dark) -->
  <g transform="translate(1.6 2.1)" fill="#6B4E0E" opacity="0.55">
    <path d="M 163.52 70.43 L 136.78 91.66 L 135.76 94.11 L 144.13 101.26 L 144.33 164.13 L 164.54 178.63 L 165.56 177.61 L 165.56 71.66 Z"/>
    <path d="M 92.27 70.43 L 91.25 71.45 L 91.25 177.81 L 93.50 178.63 L 112.69 164.13 L 113.30 101.46 L 134.53 117.38 L 134.53 160.46 L 138.00 162.50 L 138.00 105.75 L 127.80 96.77 L 93.91 70.63 Z"/>
  </g>

  <!-- N mark — main, same path outlines as production, richer gradient + subtle bright edge -->
  <g fill="url(#nGold)" stroke="#FFF6DC" stroke-width="0.5" stroke-opacity="0.5">
    <path d="M 163.52 70.43 L 136.78 91.66 L 135.76 94.11 L 144.13 101.26 L 144.33 164.13 L 164.54 178.63 L 165.56 177.61 L 165.56 71.66 Z"/>
    <path d="M 92.27 70.43 L 91.25 71.45 L 91.25 177.81 L 93.50 178.63 L 112.69 164.13 L 113.30 101.46 L 134.53 117.38 L 134.53 160.46 L 138.00 162.50 L 138.00 105.75 L 127.80 96.77 L 93.91 70.63 Z"/>
  </g>

  <!-- Soft diagonal gloss, clipped to shield silhouette so it never spills outside -->
  <g clip-path="url(#shieldClip)">
    <polygon points="40,90 130,20 175,20 70,150" fill="url(#glossStreak)"/>
  </g>
</svg>
